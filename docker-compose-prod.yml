version: '3.8'

services:
  # mysql:
  #   image: mysql
  #   container_name: roles-management-mysql
  db:
    image: mysql:8.0
    container_name: roles-management-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 'roles_management_db'
      MYSQL_USER: 'roles_management_db'
      MYSQL_PASSWORD: 'roles_management_db'
      MYSQL_ROOT_PASSWORD: 'rootpassword'
    ports:
      - "3307:3306" # Map host port 3307 to container port 3306
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: . # Build the image from the Dockerfile-prod in the current directory
    container_name: roles-management-app
    restart: on-failure
    depends_on:
      - db
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080

volumes:
  db_data: